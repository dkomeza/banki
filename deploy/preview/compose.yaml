# The Preview template (ADR-0008): one Preview of one pull request, run by the
# pull agent as the Compose project `banki-pr-<N>`. The agent bakes this file
# into its image from `main`, so a pull request can't change how its own
# Preview runs. It runs the images CI pushed, pinned by digest, and builds
# nothing. Its hardening follows the root compose.yaml.
#
# The agent sets these for each run; none of them is a secret:
#   PREVIEW_PR           the PR number <N>
#   PREVIEW_SHA          the PR's head commit
#   PREVIEW_DEPLOYED_AT  when this deploy started (ISO 8601)
#   API_DIGEST           the digest of ghcr.io/dkomeza/banki-api:pr-<N>-<sha>
#   WEB_DIGEST           the digest of ghcr.io/dkomeza/banki-web:pr-<N>-<sha>
#
# Neither this file nor any container's environment holds the Password: it
# reaches `banki setup` on stdin only. AUTH_SECRET stays unset, so the API
# generates one in the fresh volume of every deploy.

# Every object the project makes carries these, so the agent finds the
# project, and the images to remove with it, even when only a volume and a
# network are left (a failed seed).
x-labels: &labels
  banki.preview.pr: ${PREVIEW_PR:?}
  banki.preview.sha: ${PREVIEW_SHA:?}
  banki.preview.deployed-at: ${PREVIEW_DEPLOYED_AT:?}
  banki.preview.api-digest: ${API_DIGEST:?}
  banki.preview.web-digest: ${WEB_DIGEST:?}

services:
  api:
    image: ghcr.io/dkomeza/banki-api@${API_DIGEST:?}
    restart: unless-stopped
    environment:
      ORIGIN: https://pr-${PREVIEW_PR:?}.banki.dkomeza.com
    labels: *labels
    # Only the project's internal network: just `web` reaches the API.
    networks: [default]
    volumes:
      - banki-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128

  web:
    image: ghcr.io/dkomeza/banki-web@${WEB_DIGEST:?}
    restart: unless-stopped
    environment:
      # Newt on `banki-previews`, the only proxy in front of a Preview.
      BANKI_TRUSTED_PROXIES: 172.31.255.2
    labels: *labels
    networks: [default, banki-previews]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /config:uid=1000,gid=1000
      - /data:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

networks:
  # api <-> web only, with no way out: a Preview has no internet access.
  default:
    internal: true
    labels: *labels
  # Shared by every Preview's `web` and Newt, defined in agent.compose.yaml.
  # Previews can reach each other's `web` on it.
  banki-previews:
    external: true

volumes:
  banki-data:
    labels: *labels
