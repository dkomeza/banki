# The Preview template (ADR-0008, ADR-0011): one Preview, run by the pull
# agent as the Compose project `banki-pr-<N>` for a PR Preview or
# `banki-slug-<slug>` for a Slug Preview. The agent bakes this file into its
# image from `main`, so a branch can't change how its own Preview runs. It
# runs the images CI pushed, pinned by digest, and builds nothing. Its
# hardening follows the root compose.yaml.
#
# The agent sets these for each run; none of them is a secret:
#   PREVIEW_POOL         `pr` or `slug`, naming the label below
#   PREVIEW_KEY          the PR number <N>, or the Slug
#   PREVIEW_HOST         pr-<N>.banki.dkomeza.com, or <slug>.banki.dkomeza.com
#   PREVIEW_SHA          the commit it runs
#   PREVIEW_DEPLOYED_AT  when this deploy started (ISO 8601)
#   API_DIGEST           the digest of ghcr.io/dkomeza/banki-api:pr-<N>-<sha>
#                        or :slug-<slug>-<sha>
#   WEB_DIGEST           the same for ghcr.io/dkomeza/banki-web
#   API_MEMORY, API_CPUS, WEB_MEMORY, WEB_CPUS
#                        each service's limits: a PR Preview's, or the
#                        lower ones of a Slug Preview
#
# Neither this file nor any container's environment holds the Password: it
# reaches `banki setup` on stdin only. AUTH_SECRET stays unset, so the API
# generates one in the fresh volume of every deploy.

# Every object the project makes carries these, so the agent finds the
# project, and the images to remove with it, even when only a volume and a
# network are left (a failed seed).
# A list, so the first label's name can be `banki.preview.pr` or
# `banki.preview.slug`.
x-labels: &labels
  - banki.preview.${PREVIEW_POOL:?}=${PREVIEW_KEY:?}
  - banki.preview.sha=${PREVIEW_SHA:?}
  - banki.preview.deployed-at=${PREVIEW_DEPLOYED_AT:?}
  - banki.preview.api-digest=${API_DIGEST:?}
  - banki.preview.web-digest=${WEB_DIGEST:?}

services:
  api:
    image: ghcr.io/dkomeza/banki-api@${API_DIGEST:?}
    restart: unless-stopped
    environment:
      ORIGIN: https://${PREVIEW_HOST:?}
    labels: *labels
    # Only the project's internal network: just `web` reaches the API.
    networks: [default]
    volumes:
      - banki-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${API_MEMORY:?}
    cpus: ${API_CPUS:?}
    pids_limit: 128

  web:
    image: ghcr.io/dkomeza/banki-web@${WEB_DIGEST:?}
    restart: unless-stopped
    environment:
      # The api's ORIGIN: an https one, so Caddy sends HSTS.
      BANKI_ORIGIN: https://${PREVIEW_HOST:?}
      # Newt on `banki-previews`, the only proxy in front of a Preview.
      BANKI_TRUSTED_PROXIES: 172.31.255.2
    labels: *labels
    networks: [default, banki-previews]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /config:uid=1000,gid=1000
      - /data:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${WEB_MEMORY:?}
    cpus: ${WEB_CPUS:?}
    pids_limit: 64

networks:
  # api <-> web only, with no way out: a Preview has no internet access.
  default:
    internal: true
    labels: *labels
  # Shared by every Preview's `web` and Newt, defined in agent.compose.yaml.
  # Previews can reach each other's `web` on it.
  banki-previews:
    external: true

volumes:
  banki-data:
    labels: *labels
