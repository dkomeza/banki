# The Runner (ADR-0012), on the home server, beside the pull agent and
# sharing nothing with it: no Docker socket, not on banki-previews, none of
# ~/.config/banki-preview. Start it from a checkout of `main`:
#
#   BANKI_RUNNER_COMMIT="$(git rev-parse HEAD)" docker compose -f deploy/runner/compose.yaml up -d --build
#
# Its secrets come from `deploy/runner/bootstrap`, which writes them to
# $BANKI_RUNNER_SECRETS (default ~/.config/banki-runner), outside the clone,
# and the host user's uid and gid and the host's timezone to
# deploy/runner/.env, which Compose reads from here. See "Runner" in the
# README. No service publishes a host port.

name: banki-runner

# Both services: one image, built once, by the runner's service, and never
# pulled, since `banki-runner` on a registry is anyone's (`up` without --build
# builds it when it is missing); and the same hardening.
x-hardening: &hardening
  image: banki-runner
  pull_policy: never
  # As the host user, who owns the 0600 secret files, so reading them needs no
  # capability at all.
  user: "${BANKI_RUNNER_UID:?run deploy/runner/bootstrap}:${BANKI_RUNNER_GID:?run deploy/runner/bootstrap}"
  read_only: true
  tmpfs:
    - /tmp
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  # Bun isn't PID 1, so `docker compose stop` ends it straight away.
  init: true
  restart: unless-stopped

services:
  broker:
    <<: *hardening
    command: ["bun", "/opt/banki-runner/broker/main.ts"]
    environment:
      HOME: /tmp
      BANKI_BROKER_SOCKET: /run/banki-broker/broker.sock
    # GITHUB_APP_ID and LINEAR_CLIENT_ID: not secret.
    env_file: ${BANKI_RUNNER_SECRETS:-${HOME}/.config/banki-runner}/broker.env
    # The keys, as files under /run/secrets: never in an environment.
    secrets: [github-app-key, linear-client-secret]
    volumes:
      # Its socket, the one thing it shares with the runner.
      - banki-runner-broker:/run/banki-broker
    mem_limit: 128m
    # Its own network, for GitHub and Linear.
    networks: [broker]

  runner:
    <<: *hardening
    build:
      context: .
      args:
        # The commit of `main` it is built from, which the tick loop compares
        # with `main` to say when the image needs rebuilding.
        BANKI_RUNNER_COMMIT: ${BANKI_RUNNER_COMMIT:-}
    # Docker mounts a tmpfs noexec, and the Stages' tests write scripts to
    # /tmp and run them, as they do on the laptop.
    tmpfs:
      - /tmp:exec
    environment:
      # ~/.claude, bun's cache and Playwright's browsers, on the volume.
      HOME: /work/home
      PLAYWRIGHT_BROWSERS_PATH: /work/home/ms-playwright
      BANKI_BROKER_SOCKET: /run/banki-broker/broker.sock
      # Its network has no IPv6 address, so glibc leaves ::1 out when Node
      # connects to `localhost`, though Node still listens there on ::1: the
      # `ui` script would never reach Vite. IPv4 first puts both on 127.0.0.1.
      NODE_OPTIONS: --dns-result-order=ipv4first
      # Server time, the host's, which bootstrap records: the window's clock.
      TZ: ${BANKI_RUNNER_TZ:?run deploy/runner/bootstrap}
      # The Dispatcher's (README § Runner), each with its default; set one in
      # deploy/runner/.env to change it. Stages start every night and all day
      # on the open days, at most BANKI_RUNNER_MAX_STAGES at once, running or
      # paused, and only while the week's usage, with what they are estimated
      # to take, stays within the Ceiling.
      BANKI_RUNNER_NIGHT: ${BANKI_RUNNER_NIGHT:-01:00-07:00}
      BANKI_RUNNER_OPEN_DAYS: ${BANKI_RUNNER_OPEN_DAYS:-sat,sun}
      BANKI_RUNNER_CEILING: ${BANKI_RUNNER_CEILING:-0.60}
      BANKI_RUNNER_MAX_STAGES: ${BANKI_RUNNER_MAX_STAGES:-2}
    # The Claude token alone. It asks the Broker for GitHub and Linear tokens.
    secrets: [claude-token]
    volumes:
      # The clone of main, the worktrees, the logs, the Dispatcher's records and HOME.
      - banki-runner-work:/work
      - banki-runner-broker:/run/banki-broker
    # The Stages run tests, the `ui` stack and Chromium. No CPU cap.
    mem_limit: 8g
    shm_size: 1g
    # Its own network, for GitHub, Linear, Anthropic and the package registries.
    networks: [runner]

networks:
  broker: {}
  # A subnet of its own, fixed so the host's firewall rules can name it
  # (deploy/runner/host-firewall): a Stage reaches the internet, never the
  # home server's ports or the home LAN. Outside Docker's default pools, and
  # not the Previews' 172.31.255.0/24.
  runner:
    ipam:
      config:
        - subnet: 10.213.94.0/24

volumes:
  banki-runner-work:
    name: banki-runner-work
  banki-runner-broker:
    name: banki-runner-broker

secrets:
  github-app-key:
    file: ${BANKI_RUNNER_SECRETS:-${HOME}/.config/banki-runner}/github-app-key
  linear-client-secret:
    file: ${BANKI_RUNNER_SECRETS:-${HOME}/.config/banki-runner}/linear-client-secret
  claude-token:
    file: ${BANKI_RUNNER_SECRETS:-${HOME}/.config/banki-runner}/claude-token
