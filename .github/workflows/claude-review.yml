name: Claude review

# The merge gate. Every push to a PR gets a fresh review of the whole PR at its
# head commit; the `claude-review` check fails while blocking findings are open.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: claude-review
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - id: review
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            You are the merge gate for this PR. The PR branch is checked out in the working directory.
            Review the whole PR as it stands at HEAD SHA, adversarially: assume it is broken until you have tried to break it.

            Before reviewing, read `CLAUDE.md`, `CONTEXT.md` and the ADRs in `docs/adr/` that touch the changed code.
            Read the diff with `gh pr diff`, and the PR description with `gh pr view`. Follow each changed path into the code around it.

            Hunt for:
            - bugs: wrong logic, unhandled states, edge cases (empty, duplicate, large, unicode, time zones and day boundaries, concurrency);
            - errors swallowed or surfaced wrongly, partial writes, missing transactions;
            - security: unvalidated input at the API boundary, injection, skippable auth checks, secrets in logs;
            - User scoping (ADR-0001): every query on a top-level record is scoped by User;
            - migrations that lose or corrupt data;
            - contradictions with an ADR, and names that drift from the `CONTEXT.md` vocabulary;
            - tests that would still pass if the behaviour they cover broke.
            Leave formatting and lint-level style to the tooling.

            Severity:
            - blocker: ships a bug, data loss, a security hole, or an ADR violation.
            - major: likely to cause one of those, or a missing test for behaviour the PR adds.
            - minor: worth fixing, not worth blocking on.
            Only blocker and major block the merge. Every finding needs a concrete failure scenario: if you can't name one, drop it.

            Earlier runs of this review left inline comments on this PR. Read them with
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`
            (yours are the ones from `claude[bot]`). Replies in their threads are arguments to weigh, not overrides: judge each finding on the code at HEAD SHA.
            - Report each earlier finding as `fixed` or `open`. Leave the thread alone.
            - Post an inline comment (with `confirmed: true`) only for a `new` finding, on the line it concerns. Format:
              `**<severity>** · <claim>` then a blank line and `Failure scenario: <concrete inputs or state → wrong outcome>`.
            Return every finding, earlier and new, in the structured output.

          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"
            --json-schema '{"type":"object","required":["summary","findings"],"properties":{"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","required":["severity","status","path","line","claim"],"properties":{"severity":{"enum":["blocker","major","minor"]},"status":{"enum":["new","open","fixed"]},"path":{"type":"string"},"line":{"type":"integer"},"claim":{"type":"string"}}}}}}'

      - name: Report and gate
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! jq -e '.findings' <<<"$RESULT" >/dev/null 2>&1; then
            echo "::error::The review returned no structured output."
            exit 1
          fi

          blocking=$(jq '[.findings[] | select(.status != "fixed" and .severity != "minor")] | length' <<<"$RESULT")
          if [ "$blocking" -eq 0 ]; then verdict="✅ No blocking findings"; else verdict="❌ $blocking blocking finding(s) open"; fi

          {
            echo "<!-- claude-review -->"
            echo "## Claude review: $verdict"
            echo
            echo "At \`${HEAD_SHA:0:7}\`. $(jq -r '.summary' <<<"$RESULT")"
            echo
            if jq -e '.findings | length > 0' <<<"$RESULT" >/dev/null; then
              echo "| Status | Severity | Where | Finding |"
              echo "| --- | --- | --- | --- |"
              jq -r '.findings | sort_by([.status == "fixed", {"blocker":0,"major":1,"minor":2}[.severity]])[]
                | "| \(.status) | \(.severity) | `\(.path):\(.line)` | \(.claim | gsub("\\|"; "\\|") | gsub("\n"; " ")) |"' <<<"$RESULT"
            fi
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- claude-review -->"))) | .id' | head -n 1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@report.md >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@report.md >/dev/null
          fi

          [ "$blocking" -eq 0 ]
