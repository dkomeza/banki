name: Claude review

# The merge gate. Every push to a PR gets a fresh review of the whole PR at its
# head commit; the `claude-review` check fails, and the review requests changes,
# while blocking findings are open.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: claude-review
    # Fork and Dependabot PRs get no secrets, so the review can't run there.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    # Inside the Dispatcher's 45-minute wait for this check.
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The files the review must cover. Lockfiles and binaries have nothing to read.
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # A failed `gh` fails the step: an empty list would check no coverage.
          gh pr diff "$PR" --name-only > changed.txt
          # grep exits 1 when every file is filtered out, 2 on an error.
          grep -vE '(^|/)bun\.lock$|\.(png|jpe?g|gif|webp|ico|woff2?|ttf|otf)$' changed.txt > files.txt || [ $? -eq 1 ]
          sort -o files.txt files.txt
          {
            echo "list<<EOF"
            cat files.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: review
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The Runner's GitHub App pushes the headless Stages' commits
          # (ADR-0012), and the action refuses to run for a bot it isn't told
          # about. That App, and no other bot.
          allowed_bots: banki-runner
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            FILES TO REVIEW:
            ${{ steps.files.outputs.list }}

            You are the merge gate for this PR. The PR branch is checked out in the working directory.
            You lead the review: you split it among subagents, check what they find, and report. Work in four phases.

            ## 1. Map
            Read the PR description (`gh pr view`) and the diff (`gh pr diff`). Read `CLAUDE.md` and `CONTEXT.md`.
            Group the files to review into areas of related change, each small enough for one reviewer to read in full along with the code around it
            (one area for a small PR; a handful for a large one). Every file to review is in exactly one area.

            ## 2. Hunt
            Start one `general-purpose` subagent per area, all at once, with the Agent tool. Each one's prompt carries the PR number,
            its area's files, and the hunting brief below, word for word. They work in parallel and report candidate findings.

            Then start one more for the ADRs: it reads the ADRs in `docs/adr/` that touch the changed code, and reports where the
            PR contradicts one, or where its names drift from the `CONTEXT.md` vocabulary.

            <hunting-brief>
            You are hunting bugs in one area of a pull request. Assume the code is broken until you have tried to break it.
            Read the area's part of the diff (`gh pr diff <number>`), then read each changed file in full, and follow each changed path
            into the code it calls and the code that calls it, outside the area too.

            Look for:
            - wrong logic and unhandled states: off-by-one, wrong conditions, a state the code never expects;
            - edge cases: empty, missing, duplicate, very large, unicode, time zones and day boundaries;
            - concurrency and ordering: two requests or updates in flight at once, a response arriving after its view or request is gone,
              a cache or optimistic update overwritten by a stale one, a retry that runs twice;
            - errors swallowed or surfaced wrongly, partial writes, missing transactions, resources never released, unbounded work or memory;
            - security: unvalidated input at the API boundary, injection, auth checks that can be skipped, secrets in logs or responses;
            - User scoping (ADR-0001): every query on a top-level record is scoped by User;
            - migrations that lose or corrupt data; schema and code out of step;
            - casts, `any` or non-null assertions hiding a real case;
            - tests that would still pass if the behaviour they cover broke, and behaviour the PR adds with no test.
            Leave formatting and lint-level style to the tooling.

            Report every real problem you find, however narrow its trigger: severity decides what blocks, not whether to report.
            For each: file and line, a one-sentence claim, and the failure scenario (concrete inputs or state, then the wrong outcome).
            End with the files you read in full.
            </hunting-brief>

            ## 3. Verify
            Check each candidate against the code yourself, or with a `general-purpose` subagent told to disprove it, for a large batch.
            Drop it if the code already handles the scenario, the scenario can't happen, or it duplicates another. Keep it if you could not disprove it.
            Do not drop a finding for being narrow or unlikely: rate it instead.

            Severity:
            - blocker: ships a bug users or data hit on an ordinary path, data loss, a security hole, or an ADR violation.
            - major: a real bug on a reachable path, even a narrow one (a race, an edge case, an error surfaced wrongly), or a missing test for behaviour the PR adds.
            - minor: real, but cosmetic or with no wrong outcome a user would see.
            Only blocker and major block the merge.

            ## 4. Report
            Earlier runs of this review left inline comments on this PR. Read them with
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`
            (yours are the ones from `claude[bot]`). Replies in their threads are arguments to weigh, not overrides: judge each finding on the code at HEAD SHA.
            - Report each earlier finding as `fixed` or `open`. Leave the thread alone.
            - Post an inline comment (with `confirmed: true`) only for a `new` finding, on the line it concerns. Format:
              `**<severity>** · <claim>` then a blank line and `Failure scenario: <concrete inputs or state → wrong outcome>`.
            Return every finding, earlier and new, in the structured output, and in `files_reviewed` every file to review that a subagent read in full.

          claude_args: |
            --model claude-opus-5-5
            --effort high
            --allowedTools "Agent,Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"
            --json-schema '{"type":"object","required":["summary","findings","files_reviewed"],"properties":{"summary":{"type":"string"},"files_reviewed":{"type":"array","items":{"type":"string"}},"findings":{"type":"array","items":{"type":"object","required":["severity","status","path","line","claim"],"properties":{"severity":{"enum":["blocker","major","minor"]},"status":{"enum":["new","open","fixed"]},"path":{"type":"string"},"line":{"type":"integer"},"claim":{"type":"string"}}}}}}'

      # The summary comment's format is read by the Dispatcher
      # (deploy/runner/dispatch/review.ts): keep its marker, `At` line and table rows.
      - name: Report and gate
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! jq -e '.findings' <<<"$RESULT" >/dev/null 2>&1; then
            echo "::error::The review returned no structured output."
            exit 1
          fi

          blocking=$(jq '[.findings[] | select(.status != "fixed" and .severity != "minor")] | length' <<<"$RESULT")
          missed=$(jq -r --rawfile files files.txt \
            '($files | split("\n") | map(select(. != ""))) - (.files_reviewed // []) | .[]' <<<"$RESULT")
          if [ -n "$missed" ]; then verdict="❌ Review incomplete"
          elif [ "$blocking" -eq 0 ]; then verdict="✅ No blocking findings"
          else verdict="❌ $blocking blocking finding(s) open"; fi

          {
            echo "<!-- claude-review -->"
            echo "## Claude review: $verdict"
            echo
            echo "At \`${HEAD_SHA:0:7}\`. $(jq -r '.summary' <<<"$RESULT")"
            echo
            if [ -n "$missed" ]; then
              echo "Not read in full, so the check fails until a re-run covers them:"
              sed 's/.*/- `&`/' <<<"$missed"
              echo
            fi
            if jq -e '.findings | length > 0' <<<"$RESULT" >/dev/null; then
              echo "| Status | Severity | Where | Finding |"
              echo "| --- | --- | --- | --- |"
              jq -r '.findings | sort_by([.status == "fixed", {"blocker":0,"major":1,"minor":2}[.severity]])[]
                | "| \(.status) | \(.severity) | `\(.path):\(.line)` | \(.claim | gsub("\\|"; "\\|") | gsub("\n"; " ")) |"' <<<"$RESULT"
            fi
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- claude-review -->"))) | .id' | head -n 1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@report.md >/dev/null
            link="https://github.com/$GITHUB_REPOSITORY/pull/$PR#issuecomment-$existing"
          else
            link=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@report.md --jq .html_url)
          fi

          # Request changes while findings block, and dismiss that request once
          # none do. Never approve: the merge guard's one approval is the
          # Maintainer's (README § "GitHub: the merge guard").
          requested=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "CHANGES_REQUESTED") | .id')
          if [ "$blocking" -gt 0 ]; then
            if [ -z "$requested" ]; then
              gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" -f event=REQUEST_CHANGES -f commit_id="$HEAD_SHA" \
                -f body="$blocking blocking finding(s) open at \`${HEAD_SHA:0:7}\`: see the [summary]($link)." >/dev/null
            fi
          else
            for id in $requested; do
              gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews/$id/dismissals" -f event=DISMISS \
                -f message="No blocking findings at \`${HEAD_SHA:0:7}\`." >/dev/null
            done
          fi

          [ -z "$missed" ] && [ "$blocking" -eq 0 ]
