name: Grader eval

# Runs every curated Model over the Grader's eval samples on the real
# OpenRouter (README § The Grader's eval). It fails only when the default Model
# is two or more Ratings off on a sample; the other Models' results go in the
# job summary. Without the OPENROUTER_API_KEY secret (Dependabot, a fork, or
# before the Maintainer adds it) the script skips with a note.

on:
  pull_request:
    paths:
      - apps/api/src/grader/**
      - packages/shared/src/models.ts
      - .github/workflows/grader-eval.yml
  workflow_dispatch:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"

concurrency:
  group: grader-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    name: grader eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Run the eval
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bun run --cwd apps/api grader:eval
