name: Release

# Cuts Releases and ships them to Production (ADR-0017).
#
# On every push to main, release-please keeps one Release PR open with the next
# version and its notes (release-please-config.json). The PR is opened with
# GITHUB_TOKEN, so it runs no workflows: the Maintainer merges it with the
# ruleset's admin bypass, and CI runs on main right after. Whenever
# release-please opens or updates the Release PR, the job brings bun.lock on
# its branch to the new version too.
#
# Merging it makes release-please tag vX.Y.Z and create the GitHub Release, and
# the promotion runs in the same run, since a tag pushed with GITHUB_TOKEN
# triggers nothing either. It waits for Edge to run the release commit, tags
# the very digests Edge ran as vX.Y.Z, creates a `production` Deployment of
# them for the pull agent, waits for Production, and only then moves latest.
# When Edge or Production fails, the Release is marked not shipped.
#
# A promotion that failed on a transient error is retried with "Re-run failed
# jobs": release-please already succeeded, so it creates no second Release.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One at a time, so two pushes never update the Release PR at once.
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # bun.lock records each workspace's version, so the Release PR brings it
      # to the new one: otherwise the next `bun install` rewrites it, in
      # whichever PR comes after the Release. release-please pushes its branch
      # afresh whenever it opens or updates the Release PR, so this runs then.
      - name: Find the Release PR's branch
        id: branch
        if: steps.release.outputs.prs_created == 'true'
        env:
          PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          branch="$(jq -r '.headBranchName // empty' <<<"$PR")"
          if ! [[ "$branch" =~ ^release-please--[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::release-please gave no Release PR branch"
            exit 1
          fi
          echo "name=$branch" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.branch.outputs.name != ''
        with:
          ref: ${{ steps.branch.outputs.name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.branch.outputs.name != ''
        with:
          bun-version-file: package.json
      - name: Update bun.lock
        id: lockfile
        if: steps.branch.outputs.name != ''
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          bun install --lockfile-only --ignore-scripts
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "chore: update bun.lock to the Release's version" -- bun.lock
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Pushed bun.lock to $BRANCH"

  promote:
    name: promote
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    # Two waits of up to an hour each, and the rest.
    timeout-minutes: 150
    # One promotion at a time across runs, never cancelled.
    concurrency:
      group: release-promotion
      cancel-in-progress: false
    permissions:
      contents: write
      deployments: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA: ${{ needs.release-please.outputs.sha }}
      TAG: ${{ needs.release-please.outputs.tag }}
      # How often each wait polls, and how long it waits, in seconds.
      POLL_SECONDS: "30"
      WAIT_SECONDS: "3600"
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Edge has run the commit once any of its `edge` Deployments has a
      # success status anywhere in its history: the agent may have marked it
      # inactive since, when a newer one succeeded. Main images creates them
      # once the commit's images exist, so there may be none yet. Without a
      # success, a failure or error status fails the wait, and so does an
      # inactive one, which a newer merge's Deployment superseded before the
      # agent ran it.
      - name: Wait for Edge
        id: edge
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            fail "release-please gave no commit or tag"
          fi
          deadline=$((SECONDS + WAIT_SECONDS))
          while true; do
            deployments="$(gh api --paginate "repos/$GITHUB_REPOSITORY/deployments?environment=edge&sha=$SHA&per_page=100" | jq -cs 'add // []')"
            ran="" failed=""
            # The newest first, so the payload is the newest successful one's.
            for id in $(jq -r 'sort_by([.created_at, .id]) | reverse | .[].id' <<<"$deployments"); do
              states="$(gh api --paginate "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" \
                | jq -cs 'add // [] | sort_by([.created_at, .id]) | map(.state)')"
              if jq -e 'index("success") != null' <<<"$states" >/dev/null; then
                ran="$id"
                break
              fi
              if jq -e 'index("failure") != null or index("error") != null' <<<"$states" >/dev/null; then
                failed="Edge failed to deploy $SHA (Deployment $id)"
              elif [ "$(jq -r '.[-1] // empty' <<<"$states")" = inactive ]; then
                failed="Edge's Deployment $id of $SHA was superseded before Edge ran it"
              fi
            done
            if [ -n "$ran" ]; then
              break
            fi
            if [ -n "$failed" ]; then
              fail "$failed"
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              fail "Edge hasn't run $SHA after $((WAIT_SECONDS / 60)) minutes"
            fi
            echo "Waiting for Edge to run $SHA"
            sleep "$POLL_SECONDS"
          done
          payload="$(jq -c --argjson id "$ran" '
            map(select(.id == $id)) | .[0].payload
            | if type == "string" then (try fromjson catch {}) else . end
            | if type == "object" then . else {} end
          ' <<<"$deployments")"
          if [ "$(jq -r '.sha // empty' <<<"$payload")" != "$SHA" ]; then
            fail "Edge's Deployment $ran isn't of $SHA"
          fi
          for app in api web; do
            digest="$(jq -r --arg app "$app" '.[$app] // empty' <<<"$payload")"
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              fail "Edge's Deployment $ran has no $app digest"
            fi
          done
          jq -r '"api=\(.api)\nweb=\(.web)"' <<<"$payload" >>"$GITHUB_OUTPUT"
          echo "Edge ran $SHA (Deployment $ran)"

      # Checks both digests are the release commit's sha-<sha> manifests before
      # tagging either, and never moves a vX.Y.Z tag that is already elsewhere.
      # Tagging by digest copies the multi-arch index as it is: no rebuild.
      - name: Tag the images
        id: tag
        env:
          API: ${{ steps.edge.outputs.api }}
          WEB: ${{ steps.edge.outputs.web }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r '.digest // empty'
          }
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for app in api web; do
            image="ghcr.io/$owner/banki-$app"
            if [ "$app" = api ]; then digest="$API"; else digest="$WEB"; fi
            built="$(digest_of "$image:sha-$SHA")" || fail "couldn't read $image:sha-$SHA"
            if [ "$built" != "$digest" ]; then
              fail "Edge ran $image@$digest, but $image:sha-$SHA is ${built:-missing}"
            fi
            if tagged="$(digest_of "$image:$TAG" 2>/dev/null)" && [ -n "$tagged" ] && [ "$tagged" != "$digest" ]; then
              fail "$image:$TAG is already $tagged, not $digest"
            fi
          done
          for app in api web; do
            image="ghcr.io/$owner/banki-$app"
            if [ "$app" = api ]; then digest="$API"; else digest="$WEB"; fi
            docker buildx imagetools create --tag "$image:$TAG" "$image@$digest"
            tagged="$(digest_of "$image:$TAG")"
            if [ "$tagged" != "$digest" ]; then
              fail "$image:$TAG is $tagged, not $digest"
            fi
            echo "$image:$TAG is $digest"
          done

      # The agent deploys only Production's newest Deployment, so this never
      # creates one older than it: a re-run of an old Release's promotion fails
      # here instead of taking Production back. A re-run whose Deployment
      # already succeeded reuses it rather than deploying Production again.
      - name: Deploy Production
        id: production
        env:
          API: ${{ steps.edge.outputs.api }}
          WEB: ${{ steps.edge.outputs.web }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          newest="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=100" \
            | jq -c 'max_by([.created_at, .id]) // empty')"
          if [ -n "$newest" ]; then
            newest_sha="$(jq -r '.sha' <<<"$newest")"
            if [ "$newest_sha" != "$SHA" ]; then
              status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...$newest_sha" | jq -r '.status // empty')"
              case "$status" in
                ahead) fail "Production's newest Deployment is of $newest_sha, newer than $SHA" ;;
                behind | diverged) ;;
                *) fail "couldn't compare $SHA with $newest_sha" ;;
              esac
            else
              id="$(jq -r '.id' <<<"$newest")"
              same="$(jq -r --arg api "$API" --arg web "$WEB" '
                .payload | if type == "string" then (try fromjson catch {}) else . end
                | type == "object" and .api == $api and .web == $web
              ' <<<"$newest")"
              state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" | jq -r '.[0].state // empty')"
              if [ "$same" = true ] && [ "$state" = success ]; then
                echo "Production already runs $TAG (Deployment $id)"
                echo "id=$id" >>"$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          body="$(jq -n --arg sha "$SHA" --arg api "$API" --arg web "$WEB" --arg tag "$TAG" '{
            ref: $sha,
            environment: "production",
            payload: { sha: $sha, api: $api, web: $web },
            description: "Production \($tag)",
            required_contexts: [],
            auto_merge: false,
            transient_environment: false,
            production_environment: true
          }')"
          id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - <<<"$body" | jq -r '.id // empty')"
          if ! [[ "$id" =~ ^[0-9]+$ ]]; then
            fail "GitHub didn't create the Deployment"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --input - --silent \
            <<<'{"state":"queued","description":"waiting for the agent","auto_inactive":false}'
          echo "Deployment $id deploys $TAG to Production"
          echo "id=$id" >>"$GITHUB_OUTPUT"

      - name: Wait for Production
        id: deployed
        env:
          ID: ${{ steps.production.outputs.id }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          if ! [[ "$ID" =~ ^[0-9]+$ ]]; then
            fail "there is no Production Deployment to wait for"
          fi
          deadline=$((SECONDS + WAIT_SECONDS))
          while true; do
            state="$(gh api --paginate "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses?per_page=100" \
              | jq -rs 'add // [] | max_by([.created_at, .id]) // {} | .state // empty')"
            case "$state" in
              success)
                echo "Production runs $TAG"
                exit 0
                ;;
              failure | error | inactive) fail "Production's Deployment $ID of $TAG ended $state" ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              fail "Production hasn't run $TAG after $((WAIT_SECONDS / 60)) minutes"
            fi
            echo "Waiting for Production to run $TAG (${state:-no status})"
            sleep "$POLL_SECONDS"
          done

      - name: Move latest
        id: latest
        env:
          API: ${{ steps.edge.outputs.api }}
          WEB: ${{ steps.edge.outputs.web }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for app in api web; do
            image="ghcr.io/$owner/banki-$app"
            if [ "$app" = api ]; then digest="$API"; else digest="$WEB"; fi
            docker buildx imagetools create --tag "$image:latest" "$image@$digest"
            tagged="$(docker buildx imagetools inspect "$image:latest" --format '{{json .Manifest}}' | jq -r '.digest // empty')"
            if [ "$tagged" != "$digest" ]; then
              echo "::error::$image:latest is $tagged, not $digest"
              exit 1
            fi
            echo "$image:latest is $digest"
          done

      # A re-run that shipped a Release an earlier attempt marked not shipped
      # takes the mark off and makes it GitHub's Latest again.
      - name: Mark the Release shipped
        id: shipped
        run: |
          set -euo pipefail
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          body="$(jq -r '.body // ""' <<<"$release")"
          if [[ "$body" != "**Not shipped:**"* ]]; then
            exit 0
          fi
          id="$(jq -r '.id' <<<"$release")"
          jq -n --arg body "$body" '{
            body: ($body | split("\n") | .[1:] | until(.[0] != ""; .[1:]) | join("\n")),
            make_latest: "true"
          }' | gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" --input - --silent
          echo "$TAG is shipped"

      # When Edge or Production failed: the tag and the Release stay, latest
      # stays where it was, and GitHub's Latest goes back to the newest Release
      # Production ran, the one its newest successful Deployment deployed.
      - name: Mark the Release not shipped
        id: unshipped
        if: failure() && (steps.edge.outcome == 'failure' || steps.deployed.outcome == 'failure')
        env:
          EDGE: ${{ steps.edge.outcome }}
        run: |
          set -euo pipefail
          if [ "$EDGE" = failure ]; then
            line="**Not shipped:** Edge failed on this commit, and the next Release carries the fix."
          else
            line="**Not shipped:** Production failed to deploy it, and the next Release carries the fix."
          fi
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          id="$(jq -r '.id' <<<"$release")"
          # An earlier attempt's mark is replaced, never stacked.
          jq --arg line "$line" '{
            body: ((.body // "") as $body
              | ($body | split("\n")) as $lines
              | if ($lines[0] // "" | startswith("**Not shipped:**")) then
                  ([$line] + $lines[1:]) | join("\n")
                else
                  "\($line)\n\n\($body)"
                end),
            make_latest: "false"
          }' <<<"$release" | gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" --input - --silent
          echo "Marked $TAG not shipped"
          shipped=""
          deployments="$(gh api --paginate "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=100" | jq -cs 'add // []')"
          while IFS=$'\t' read -r deployment description; do
            [ -n "$deployment" ] || continue
            tag="${description#Production }"
            if [ "$tag" = "$TAG" ] || ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              continue
            fi
            if gh api --paginate "repos/$GITHUB_REPOSITORY/deployments/$deployment/statuses?per_page=100" \
              | jq -es 'add // [] | any(.state == "success")' >/dev/null; then
              shipped="$tag"
              break
            fi
          done < <(jq -r 'sort_by([.created_at, .id]) | reverse | .[] | "\(.id)\t\(.description // "")"' <<<"$deployments")
          if [ -z "$shipped" ]; then
            echo "Production has run no Release yet"
            exit 0
          fi
          other="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$shipped" | jq -r '.id // empty')"
          if [ -n "$other" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$other" --input - --silent <<<'{"make_latest":"true"}'
            echo "GitHub's Latest is $shipped again"
          fi
