  <g stroke="#f9f5ed" stroke-width="18" stroke-linejoin="round">
    <rect x="178" y="108" width="236" height="168" rx="24" fill="#e39a72" transform="rotate(9 296 192)" />
    <rect x="138" y="168" width="236" height="168" rx="24" fill="#c9622c" transform="rotate(2 256 252)" />
    <rect x="98" y="228" width="236" height="168" rx="24" fill="#ab4400" transform="rotate(-5 216 312)" />
  </g>
  <g stroke="#f9f5ed" stroke-width="16" stroke-linecap="round" transform="rotate(-5 216 312)">
    <path d="M136 290h112M136 334h160" />
